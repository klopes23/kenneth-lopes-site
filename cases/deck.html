<head>

  <link rel="stylesheet" href="../mobile.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Inter Tight','Inter','system-ui','sans-serif'],
            display: ['Fraunces','Georgia','serif'],
            italic:  ['Instrument Serif','Georgia','serif'],
            mono:    ['JetBrains Mono','ui-monospace','monospace'],
          },
          colors: {
            cream:   '#F2EBDA',
            paper:   '#FAF6EA',
            'cream-2': '#E8E0CC',
            ink:     '#1B2A1B',
            'ink-2': '#3A4A3A',
            forest:  '#2D4A2B',
            olive:   '#5E7030',
            pop:     '#C76F3D',
            mutedfg: '#7A8A7A',
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
  <script>
    /* Force classic JSX runtime so JSX compiles to React.createElement
       (works with UMD React global; the default 'automatic' runtime
       tries to import 'react/jsx-runtime' which fails in UMD mode). */
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>
  <style>
    html, body { background: #F2EBDA; font-family: 'Inter Tight', 'Inter', system-ui, sans-serif; }
    body { margin: 0; }
    .deck-stage { aspect-ratio: 16 / 9; }
    @keyframes pulse-pin {
      0%, 100% { box-shadow: 0 0 0 0 rgba(45,74,43,0.55); }
      50%      { box-shadow: 0 0 0 14px rgba(45,74,43,0); }
    }
    .pin-pulse { animation: pulse-pin 2s ease-out infinite; }
    /* ─── MOBILE (v3 fallback only — v4 mobile uses deck-mobile.jsx + mobile.css)
       Kept for tablets between 769–900px. Below 768px, DeckMobile renders instead. ─── */
    @media (min-width: 769px) and (max-width: 900px) {
      body { background: #F2EBDA; }
      .mobile-deck { min-height: 100vh; padding: 0 !important; }
      html { scroll-padding-top: 96px; }
      /* v4: deck-track gets explicit auto behavior so JS smooth-scroll works without html-level interference */
      .deck-track { scroll-behavior: auto; }
      .mobile-slide {
        position: relative;
        width: 100%;
        background: #FAF6EA;
        border-bottom: none;
        overflow: hidden;
      }
      /* Section divider between slides (chevron-down) */
      .mobile-slide:not(:last-child)::after {
        content: '';
        position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%) rotate(45deg);
        width: 10px; height: 10px;
        border-right: 2px solid rgba(199,111,61,0.55);
        border-bottom: 2px solid rgba(199,111,61,0.55);
        opacity: 0.7;
      }
      .mobile-slide:last-child {
        padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      }
      .mobile-slide > div {
        position: relative !important;
        inset: auto !important;
        padding: 24px 18px 56px !important;
        display: flex;
        flex-direction: column;
        max-width: 720px;
        margin: 0 auto;
      }
      /* Cap inflated clamp() display sizes from desktop layout */
      .mobile-slide h1, .mobile-slide [class*="font-display"][class*="text-["] {
        font-size: clamp(22px, 6vw, 32px) !important;
        line-height: 1.12 !important;
      }
      .mobile-slide h3 { font-size: 16px !important; }
      /* Pin chip sizes so they don't overflow */
      .mobile-slide .max-w-\[34ch\], .mobile-slide .max-w-\[44ch\], .mobile-slide .max-w-\[28ch\], .mobile-slide .max-w-\[68ch\] {
        max-width: 100% !important;
      }
      /* Force in-slide title rows to wrap (was nowrap to fit on one line on desktop) */
      .mobile-slide [style*="white-space:nowrap"], .mobile-slide [style*="whiteSpace:nowrap"] { white-space: normal !important; }
      /* Force the deck stage off; let sections expand naturally */
      .mobile-slide .deck-stage { aspect-ratio: auto !important; height: auto !important; }
      /* Remove fixed heights on internal containers */
      .mobile-slide [class*="min-h-screen"] { min-height: 0 !important; }
      .mobile-slide [class*="absolute"][class*="inset-0"]:not(img):not([style*="background"]) { position: relative !important; inset: auto !important; }
      /* ── Top progress bar ── */
      .mobile-progress-track {
        position: sticky; top: var(--m-bar-h, 52px); left: 0; right: 0; z-index: 60;
        height: 3px; background: rgba(27,42,27,0.08);
        margin-top: -1px;
      }
      .mobile-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #2D4A2B 0%, #C76F3D 100%);
        transition: width 0.35s cubic-bezier(.2,.7,.2,1);
      }
      /* ── Dynamic title bar (tappable to open TOC) ── */
      .mobile-title-bar {
        position: sticky; top: calc(var(--m-bar-h, 52px) + 3px); z-index: 55;
        width: 100%; appearance: none; -webkit-appearance: none;
        display: grid; grid-template-columns: auto 1fr auto;
        align-items: center; gap: 10px;
        padding: 10px 18px;
        background: rgba(250,246,234,0.96);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: none; border-bottom: 1px solid rgba(27,42,27,0.08);
        cursor: pointer; text-align: left;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s;
      }
      .mobile-title-bar:active { background: rgba(232,224,204,0.96); }
      .mobile-title-chevron { display: inline-block; vertical-align: -2px; margin-left: 6px; color: #7A8A7A; }
      .mobile-title-kicker {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase;
        color: #C76F3D; font-weight: 600;
        padding: 4px 8px; background: rgba(199,111,61,0.08);
        border-radius: 6px;
      }
      .mobile-title-name {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 15px; font-weight: 600;
        color: #1B2A1B; letter-spacing: -0.01em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .mobile-title-count {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px; color: #1B2A1B; font-weight: 600;
        tabular-nums: 1; font-feature-settings: 'tnum';
      }
      .mobile-title-count span { color: #7A8A7A; font-weight: 400; }
      /* Loosen rigid grids so they wrap on narrow viewports */
      .mobile-slide [class*="grid-cols-"] { display: flex !important; flex-direction: column !important; gap: 16px !important; }
      .mobile-slide [class*="grid-cols-2"][class*="grid-rows-2"] { display: grid !important; grid-template-columns: 1fr 1fr !important; grid-template-rows: auto auto !important; gap: 8px !important; }
      .mobile-slide [class*="grid-cols-[260px"] { display: flex !important; flex-direction: column !important; }
      .mobile-slide [class*="grid-cols-[1fr_360px"], .mobile-slide [class*="grid-cols-[1fr_340px"], .mobile-slide [class*="grid-cols-[1fr_320px"], .mobile-slide [class*="grid-cols-[1fr_300px"] { display: flex !important; flex-direction: column !important; }
      .mobile-slide [class*="grid-cols-[280px"] { display: flex !important; flex-direction: column !important; }
      .mobile-slide [class*="grid-cols-[260px_1fr"] { display: flex !important; flex-direction: column !important; }
      /* Embedded dashboard iframe — give it a real height */
      .mobile-slide iframe { min-height: 70vh; height: 70vh !important; }
      /* Aspect-locked photos in CEC need a real height */
      .mobile-slide .grid.grid-cols-2.grid-rows-2 > div { min-height: 160px; }
      /* ── Cover slide (Slide0): cap headshot, 2-col contact grid, wrap creds ── */
      .mobile-slide [class*="rounded-full"][class*="aspect-square"] { max-width: 180px !important; margin: 0 auto !important; }
      .mobile-slide [class*="rounded-full"][class*="ring-"][class*="overflow-hidden"] { width: 180px !important; height: 180px !important; margin: 0 auto !important; }
      .mobile-slide .grid.grid-cols-3 { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      .mobile-slide .grid.grid-cols-3 > div:last-child:nth-child(odd) { grid-column: span 2; }
      .mobile-slide [class*="grid-cols-4"] { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
      .mobile-slide [class*="grid-cols-5"] { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
      /* Cover: shrink huge "TPM, Product & Strategy" hero from 72px to fit phone */
      .mobile-slide [class*="text-[clamp(44px"], .mobile-slide [class*="text-[clamp(56px"] {
        font-size: clamp(34px, 9vw, 48px) !important;
      }
      /* Subtitles / mono lines stay legible */
      .mobile-slide [class*="font-mono"] { font-size: 10.5px !important; }
      /* Stats / tile grids inside slides */
      .mobile-slide .text-\[26px\], .mobile-slide [class*="text-[26px]"] { font-size: 22px !important; }
      .mobile-slide .text-\[32px\], .mobile-slide [class*="text-[32px]"] { font-size: 26px !important; }
      .mobile-slide .text-\[48px\], .mobile-slide [class*="text-[48px]"] { font-size: 34px !important; }
      .mobile-slide .text-\[52px\], .mobile-slide [class*="text-[52px]"] { font-size: 38px !important; }
      /* Cover stat chips wrap */
      .mobile-slide .flex.flex-wrap > * { font-size: 11px !important; padding: 6px 10px !important; }
      /* Sticky mobile slide jumper — pill with bigger tap targets */
      .mobile-jumper {
        position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        z-index: 100; display: flex; align-items: center; gap: 4px;
        padding: 6px; background: rgba(27,42,27,0.95); border-radius: 999px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 10px 28px rgba(27,42,27,0.3);
      }
      .mobile-jumper a {
        font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
        color: rgba(242,235,218,0.6);
        width: 32px; height: 32px;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 999px;
        text-decoration: none;
        transition: background 0.18s, color 0.18s, transform 0.12s;
        -webkit-tap-highlight-color: transparent;
      }
      .mobile-jumper a:active { transform: scale(0.92); }
      .mobile-jumper a.is-active {
        background: linear-gradient(135deg,#C76F3D 0%,#A8523A 100%);
        color: #fff;
        box-shadow: 0 2px 6px rgba(199,111,61,0.4);
      }
      /* ── TOC sheet ── */
      .mobile-toc-backdrop {
        position: fixed; inset: 0; z-index: 200;
        background: rgba(27,42,27,0.55);
        opacity: 0; pointer-events: none;
        transition: opacity 0.25s ease;
      }
      .mobile-toc-backdrop.is-open { opacity: 1; pointer-events: auto; }
      .mobile-toc-sheet {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 210;
        background: #FAF6EA;
        border-radius: 22px 22px 0 0;
        padding: 12px 18px calc(28px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 -16px 48px rgba(27,42,27,0.28);
        transform: translateY(100%);
        transition: transform 0.32s cubic-bezier(.2,.7,.2,1);
        max-height: 82vh; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .mobile-toc-sheet.is-open { transform: translateY(0); }
      .mobile-toc-handle {
        width: 44px; height: 4px; border-radius: 2px;
        background: rgba(27,42,27,0.18);
        margin: 0 auto 16px;
      }
      .mobile-toc-title {
        font-family: 'JetBrains Mono', monospace; font-size: 10px;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(27,42,27,0.55);
        padding: 0 4px 12px;
        border-bottom: 1px solid rgba(27,42,27,0.08);
        margin-bottom: 6px;
      }
      .mobile-toc-list { list-style: none; padding: 0; margin: 0; }
      .mobile-toc-list li { border-bottom: 1px solid rgba(27,42,27,0.06); }
      .mobile-toc-list li:last-child { border-bottom: none; }
      .mobile-toc-item {
        appearance: none; -webkit-appearance: none;
        width: 100%; background: none; border: none; text-align: left;
        display: grid; grid-template-columns: 28px 1fr auto;
        align-items: center; gap: 14px;
        padding: 16px 4px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s;
      }
      .mobile-toc-item:active { background: rgba(27,42,27,0.04); }
      .mobile-toc-item.is-current { background: rgba(199,111,61,0.06); }
      .mobile-toc-num {
        font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
        color: rgba(27,42,27,0.4); letter-spacing: 0.06em;
      }
      .mobile-toc-item.is-current .mobile-toc-num { color: #C76F3D; }
      .mobile-toc-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .mobile-toc-kicker {
        font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
        letter-spacing: 0.22em; text-transform: uppercase;
        color: #7A8A7A; font-weight: 600;
      }
      .mobile-toc-label {
        font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 500;
        color: #1B2A1B; letter-spacing: -0.01em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .mobile-toc-item.is-current .mobile-toc-label { color: #C76F3D; font-weight: 600; }
      .mobile-toc-current {
        font-size: 10px; color: #C76F3D;
      }
      .mobile-toc-close {
        appearance: none; -webkit-appearance: none;
        display: block; width: 100%;
        margin-top: 16px; padding: 14px 16px;
        background: #1B2A1B; color: #FAF6EA;
        border: none; border-radius: 999px;
        font-family: 'JetBrains Mono', monospace; font-size: 11px;
        letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600;
        -webkit-tap-highlight-color: transparent;
      }
      .mobile-toc-close:active { background: #2D4A2B; }
    }
  </style>
</head>
<body data-palette="pro" data-deck="true">
  <div id="root"></div>
  <!-- v4 mobile branch — canonical handoff inlined (deck-mobile-shared.jsx + deck-mobile.jsx)
       Wrapped in IIFE so internal SLIDE_COMPONENTS / DECK_SLIDES don't collide with the desktop deck.
       Exports window.MS_C, MS_FONT, DeckMobile, DECK_SLIDES, DeckSlideStatic. -->
  <script type="text/babel" data-presets="react-classic">
(function(){
// proto/mobile-shared.jsx — tokens, Kicker, Sparkline, Rail, Sheet, Toast, ImageSlot, useDeckNav

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─────────────────────────────────────────────────────────────
// Tokens — mirror the site's CSS vars (cream + forest editorial)
// ─────────────────────────────────────────────────────────────
const C = {
  bg: '#F2EBDA',
  bg2: '#E8E0CC',
  cream: '#FAF6EA',
  ink: '#1B2A1B',
  ink2: '#2D4A2B',
  muted: '#7A8A7A',
  line: 'rgba(27,42,27,0.14)',
  accent: '#C76F3D',          // terracotta
  olive: '#5E7030',
  forest: '#2D4A2B',
  pop: '#D9B65A',             // mustard (deck-em italic)
  card: '#FFFFFF',
};

const FONT = {
  display: "'Fraunces', Georgia, serif",
  italic: "'Instrument Serif', Georgia, serif",
  body: "'Inter Tight', system-ui, sans-serif",
  mono: "'JetBrains Mono', ui-monospace, monospace",
};

// ─────────────────────────────────────────────────────────────
// Kicker — sticky mono uppercase top strip (CS / 0N · Title · N/T)
// ─────────────────────────────────────────────────────────────
function Kicker({ code, name, idx, total, dark = false }) {
  const fg = dark ? 'rgba(242,235,218,0.78)' : 'rgba(27,42,27,0.62)';
  return (
    <header style={{
      position: 'absolute', top: 'max(54px, env(safe-area-inset-top))',
      left: 20, right: 20, display: 'flex', justifyContent: 'space-between',
      fontFamily: FONT.mono, fontWeight: 600, fontSize: 10,
      letterSpacing: '0.22em', textTransform: 'uppercase', color: fg,
      zIndex: 5, pointerEvents: 'none',
    }}>
      <span style={{ minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
        {code} · {name}
      </span>
      <span style={{ flexShrink: 0, marginLeft: 12 }}>
        {String(idx + 1).padStart(2, '0')} / {String(total).padStart(2, '0')}
      </span>
    </header>
  );
}

// ─────────────────────────────────────────────────────────────
// Sparkline — replaces Recharts on mobile (inline SVG, ~40 lines)
// ─────────────────────────────────────────────────────────────
function Sparkline({ data, color = C.accent, height = 44, fill = true }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * 200;
    const y = height - ((v - min) / range) * (height - 6) - 3;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' L ');
  const gid = `g-${color.replace('#', '')}-${Math.round(Math.random() * 999)}`;
  return (
    <svg viewBox={`0 0 200 ${height}`} preserveAspectRatio="none"
         style={{ width: '100%', height, display: 'block' }}>
      {fill && (
        <defs>
          <linearGradient id={gid} x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.24" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
      )}
      {fill && <path d={`M 0,${height} L ${pts} L 200,${height} Z`} fill={`url(#${gid})`} />}
      <path d={`M ${pts}`} fill="none" stroke={color} strokeWidth="1.8"
            strokeLinejoin="round" strokeLinecap="round" />
      <circle cx="200" r="3" fill={color}
              cy={height - ((data[data.length - 1] - min) / range) * (height - 6) - 3} />
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────
// ImageSlot — placeholder for assets Claude Code will wire later
// ─────────────────────────────────────────────────────────────
function ImageSlot({ src, label, ratio = '4 / 5', dark = false, tint = C.bg2 }) {
  if (src) {
    return (
      <div style={{ position: 'relative', aspectRatio: ratio, overflow: 'hidden', borderRadius: 14 }}>
        <img src={src} alt="" style={{
          position: 'absolute', inset: 0, width: '100%', height: '100%',
          objectFit: 'cover',
        }} />
      </div>
    );
  }
  return (
    <div style={{
      position: 'relative', aspectRatio: ratio, borderRadius: 14,
      background: `repeating-linear-gradient(135deg, ${tint} 0 8px, ${dark ? 'rgba(0,0,0,0.18)' : 'rgba(0,0,0,0.04)'} 8px 16px)`,
      border: `1px dashed ${dark ? 'rgba(242,235,218,0.32)' : 'rgba(27,42,27,0.18)'}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 12, textAlign: 'center',
    }}>
      <span style={{
        fontFamily: FONT.mono, fontSize: 9, fontWeight: 600,
        letterSpacing: '0.22em', textTransform: 'uppercase',
        color: dark ? 'rgba(242,235,218,0.6)' : C.muted,
      }}>{label || 'asset'}</span>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Rail — single bottom chrome (replaces banner + jumper + progress)
// ─────────────────────────────────────────────────────────────
function Rail({ current, total, onPrev, onNext, onMenu, onShare }) {
  const btn = {
    width: 38, height: 38, borderRadius: 999, border: 'none',
    background: 'transparent', color: C.ink, cursor: 'pointer', padding: 0,
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
  };
  return (
    <div style={{
      position: 'absolute', left: 12, right: 12,
      bottom: 'calc(14px + env(safe-area-inset-bottom))',
      height: 54, zIndex: 100,
      display: 'grid', gridTemplateColumns: 'auto auto 1fr auto auto',
      gap: 4, alignItems: 'center', padding: '0 8px',
      background: 'rgba(250,246,234,0.86)',
      backdropFilter: 'blur(18px) saturate(170%)',
      WebkitBackdropFilter: 'blur(18px) saturate(170%)',
      border: `1px solid ${C.line}`, borderRadius: 999,
      boxShadow: '0 10px 32px rgba(27,42,27,0.12), 0 1px 0 rgba(255,255,255,0.6) inset',
    }}>
      <button style={btn} onClick={onPrev} aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3l-5 5 5 5" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>

// ─────────────────────────────────────────────────────────────
// useDeckNav — horizontal scroll-snap + index tracking + solo mode
// ─────────────────────────────────────────────────────────────
function useDeckNav(slideCount) {
  // v4 fix: read the initial #/N hash so deep-linking from portfolio cards lands on the right slide
  const parseInitial = () => {
    const m = (typeof window !== 'undefined' ? window.location.hash : '').match(/^#\/(\d+)/);
    if (!m) return 0;
    return Math.min(Math.max(parseInt(m[1], 10), 0), slideCount - 1);
  };
  const [current, setCurrent] = useState(parseInitial);
  const [solo, setSolo] = useState(false);
  const trackRef = useRef(null);

  // After mount, jump the track to the initial slide (scroll-snap won't auto-position there)
  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    if (current > 0) {
      track.scrollTo({ left: current * track.clientWidth, behavior: 'auto' });
    }
    // Also honor subsequent hashchange events (e.g., from in-page anchors)
    const onHash = () => {
      const m = window.location.hash.match(/^#\/(\d+)/);
      if (!m) return;
      const idx = Math.min(Math.max(parseInt(m[1], 10), 0), slideCount - 1);
      track.scrollTo({ left: idx * track.clientWidth, behavior: 'auto' });
      setCurrent(idx);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const onScroll = () => {
      const w = track.clientWidth;
      const idx = Math.round(track.scrollLeft / w);
      if (idx !== current) setCurrent(idx);
    };
    track.addEventListener('scroll', onScroll, { passive: true });
    return () => track.removeEventListener('scroll', onScroll);
  }, [current]);

  const go = useCallback((i) => {
    const track = trackRef.current;
    if (!track) return;
    const target = Math.max(0, Math.min(slideCount - 1, i));
    /* v4 fix: Chromium silently ignores behavior:'smooth' when scroll-snap-type: x mandatory.
       'auto' is instant — fine for a single-viewport jump and reliable everywhere. */
    track.scrollTo({ left: target * track.clientWidth, behavior: 'auto' });
    /* v4 fix #2: Chrome doesn't always fire scroll events for instant programmatic scrolls,
       so the onScroll listener may not pick up the new index. Set state directly too. */
    setCurrent(target);
  }, [slideCount]);

  return { current, setCurrent, solo, setSolo, trackRef, go };
}

const { useState: dUseState, useEffect: dUseEffect, useRef: dUseRef } = React;

// v4: long-press helper — non-hook factory so it can be called inside .map().
// Fires `callback` after `delay` ms of held touch / mouse. Right-click also
// triggers (contextmenu). Cancels on move/release.
function makeLongPress(callback, delay = 480) {
  let timer = null;
  const start = () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => { timer = null; callback(); }, delay);
  };
  const cancel = () => {
    if (timer) { clearTimeout(timer); timer = null; }
  };
  return {
    onTouchStart: start,
    onTouchEnd: cancel,
    onTouchMove: cancel,
    onTouchCancel: cancel,
    onMouseDown: start,
    onMouseUp: cancel,
    onMouseLeave: cancel,
    onContextMenu: (e) => { e.preventDefault(); cancel(); callback(); },
  };
}

// v4: dot pagination indicator for any horizontal scroll-snap carousel.
// Pass a ref to the scrolling track + the number of items.
function CarouselDots({ trackRef, count }) {
  const [active, setActive] = dUseState(0);
  dUseEffect(() => {
    const el = trackRef.current;
    if (!el || count < 2) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const first = el.firstElementChild;
        if (!first) return;
        const tileW = first.getBoundingClientRect().width;
        const gap = parseFloat(getComputedStyle(el).gap) || 10;
        const idx = Math.round(el.scrollLeft / (tileW + gap));
        setActive(Math.min(Math.max(idx, 0), count - 1));
      });
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => { cancelAnimationFrame(raf); el.removeEventListener('scroll', onScroll); };
  }, [count]);
  if (count < 2) return null;
  return (
    <div style={{
      display: 'flex', justifyContent: 'center', gap: 6,
      margin: '14px auto 0',
    }}>
      {Array.from({ length: count }).map((_, i) => (
        <span key={i} style={{
          width: i === active ? 22 : 6, height: 6, borderRadius: 999,
          background: i === active ? MS_C.accent : 'rgba(27,42,27,0.22)',
          transition: 'width 0.2s ease, background 0.2s ease',
        }}/>
      ))}
    </div>
  );
}

    /* UMD globals: React, ReactDOM, ReactRouterDOM (v6), Recharts */
    const { useState, useEffect, useCallback, useRef } = React;
    const { createRoot } = ReactDOM;
    const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceArea } = Recharts;

    /* ──────────────────────────────────────────────────────────────────
       NAVIGATION HOOK (keyboard + swipe + hash-based slide param)
       Hash format: #/0 .. #/6  (matches the React-Router pattern we ship to)
       ────────────────────────────────────────────────────────────────── */
    const TOTAL = 7;
    function parseHash() {
      const m = String(window.location.hash || '').match(/^#\/(\d+)/);
      return m ? Math.max(0, Math.min(TOTAL - 1, parseInt(m[1], 10) || 0)) : 0;
    }
    function useSlideNav() {
      const [current, setCurrent] = useState(parseHash);
      useEffect(() => {
        const onHash = () => setCurrent(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const go = useCallback((n) => {
        const next = Math.max(0, Math.min(TOTAL - 1, n));
        if (next !== current) window.location.hash = `#/${next}`;
      }, [current]);
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(current + 1); }
          else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(current - 1); }
          else if (e.key === 'Home') { e.preventDefault(); go(0); }
          else if (e.key === 'End')  { e.preventDefault(); go(TOTAL - 1); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [current, go]);
      const tx = useRef(null);
      const onTouchStart = (e) => { tx.current = e.touches[0].clientX; };
      const onTouchEnd = (e) => {
        const dx = e.changedTouches[0].clientX - (tx.current ?? 0);
        if (Math.abs(dx) > 60) go(current + (dx < 0 ? 1 : -1));
        tx.current = null;
      };
      return { current, go, onTouchStart, onTouchEnd };
    }

       DECK SHELL  (16:9 stage + nav controls + page indicator)

    function useIsMobile() {
      const [m, setM] = useState(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 900px)').matches);
      useEffect(() => {
        const mq = window.matchMedia('(max-width: 900px)');
        const onChange = () => setM(mq.matches);
        try { mq.addEventListener('change', onChange); } catch (e) { mq.addListener(onChange); }
        return () => { try { mq.removeEventListener('change', onChange); } catch (e) { mq.removeListener(onChange); } };
      }, []);
      return m;
    }

        const [visible, setVisible] = useState(current);

        useEffect(() => {
          const io = new IntersectionObserver((entries) => {
            let top = null;
            entries.forEach(e => {
              if (e.isIntersecting && (!top || e.intersectionRatio > top.intersectionRatio)) top = e;
            });
            if (top) {
              const idx = parseInt(top.target.getAttribute('data-idx'), 10);
              setVisible(idx);
              if (window.location.hash !== `#/${idx}`) {
                history.replaceState(null, '', `#/${idx}`);

            const el = document.getElementById(`mslide-${i}`);
            if (el) io.observe(el);
          });
